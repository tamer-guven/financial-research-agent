name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check patch hygiene
        run: git diff --check

      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook
